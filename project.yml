# XcodeGen project description. The GitHub workflow turns this into an Xcode project
# on a cloud Mac, so you never need a Mac yourself.
name: GapVocab
options:
  bundleIdPrefix: dev.gapvocab
  deploymentTarget:
    iOS: "16.0"
targets:
  GapVocab:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [Resources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Gap Vocab
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gapvocab.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"      # SideStore signs it on your phone
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
